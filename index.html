<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GM N4B1D DOWNLOADER</title>
<style>
body{background:#000;color:#fff;font-family:sans-serif;text-align:center;padding:20px}
h1{margin-top:40px;letter-spacing:2px}
.tags span{background:#111;border:1px solid #222;padding:6px 12px;border-radius:20px;margin:4px;display:inline-block;font-size:13px}
input{width:90%;max-width:500px;padding:16px;border-radius:12px;border:none;margin-top:25px;font-size:16px}
button{padding:16px 30px;margin-top:15px;background:#fff;color:#000;border-radius:12px;font-weight:bold;border:none;font-size:16px;width:90%;max-width:500px}
#msg{margin-top:20px;color:#0f0;word-break:break-all}
.loader{display:none;margin-top:20px}
</style>
</head>
<body>

<h1>GM N4B1D DOWNLOADER</h1>
<div class="tags">
<span>YouTube ✓</span><span>Facebook ✓</span><span>Instagram ✓</span><span>TikTok ✓</span>
</div>

<input id="urlInput" type="text" placeholder="Video link paste koro...">
<br>
<button onclick="downloadVideo()">DOWNLOAD</button>

<div class="loader" id="loader">⏳ Download hocche... Render free tai 30s lagte pare...</div>
<p id="msg"></p>

<script>
const BACKEND = "https://media-downloader-4.onrender.com/";

async function downloadVideo() {
    const url = document.getElementById('urlInput').value.trim();
    if(!url){ alert("Link deo age!"); return; }

    document.getElementById('loader').style.display = 'block';
    document.getElementById('msg').innerText = "";

    try {
        // Tomar backend form-data expect kore
        const formData = new FormData();
        formData.append('url', url);

        const res = await fetch(BACKEND, {
            method: 'POST',
            body: formData
        });
        
        const text = await res.text();
        document.getElementById('msg').innerText = text;
        
    } catch (err) {
        document.getElementById('msg').innerText = "❌ Failed! Backend ghumacche, 30 sec por abar try koro.";
        console.log(err);
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}
</script>

</body>
</html>
