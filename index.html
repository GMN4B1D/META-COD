<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GM N4B1D - META COD</title>
<style>
body{background:#000;color:#fff;text-align:center;font-family:sans-serif;padding:20px}
input{width:90%;max-width:500px;padding:15px;border-radius:10px;border:none;margin-top:20px}
button{padding:15px 30px;background:#fff;color:#000;border-radius:10px;font-weight:bold;margin-top:15px;border:none;width:90%;max-width:500px}
#result{margin-top:20px}
a{color:#0f0}
</style>
</head>
<body>
<h1>GM N4B1D META COD</h1>
<input id="url" placeholder="YouTube / FB / Insta link paste koro">
<br>
<button onclick="go()">DOWNLOAD</button>
<div id="result"></div>
<script>
async function go(){
 let u=document.getElementById('url').value;
 document.getElementById('result').innerText="⏳ Processing...";
 let res=await fetch('/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});
 let data=await res.json();
 if(data.status=='success'){
   document.getElementById('result').innerHTML=`<p>${data.title}</p><a href="${data.url}" target="_blank" download><button>CLICK TO SAVE VIDEO</button></a>`;
 }else{
   document.getElementById('result').innerText="❌ Error: "+data.error;
 }
}
</script>
</body>
</html>
